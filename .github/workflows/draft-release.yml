name: Draft Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: true
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

jobs:
  draft-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: '3.14'

      - run: uv run pbin.py pack

      - name: Create panorama.zip
        shell: bash
        run: |
          (
            tmpdir=$(mktemp -d)
            cp code_harmony.pbin "$tmpdir/"
            cp -r resources/* "$tmpdir/"
            cd "$tmpdir"
            zip -r "$OLDPWD/panorama.zip" .
            rm -rf "$tmpdir"
          )

      - name: Compose release body
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo '## Changelog' > body.md
          gh api /repos/${{ github.repository }}/releases/generate-notes \
            -f tag_name='${{ inputs.tag }}' \
            --jq '.body' >> body.md

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          draft: true
          body_path: body.md
          prerelease: ${{ inputs.prerelease }}
          files: ./panorama.zip
